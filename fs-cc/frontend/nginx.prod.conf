# nginx.prod.conf — fs-cc frontend (production only)
# Serves static Vite bundle on port 80.
# The common nginx reverse proxy handles all external routing;
# this container only needs to serve files and return index.html for SPA routes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve any existing file/directory; fall back to index.html for SPA routes.
    # The sub-path prefix (/cc/) is stripped by the upstream nginx proxy_pass
    # before the request reaches this container, so paths here are relative to /.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite content-hashes filenames,
    # so stale responses are impossible.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access logging for health probes from the upstream proxy
    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
