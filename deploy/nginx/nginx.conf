# nginx.conf — top-level configuration for the Omni Platform reverse proxy
# Included by nginx automatically as the main config file.

user  nginx;

# One worker per CPU core. "auto" lets nginx detect at runtime.
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── JSON access log ───────────────────────────────────────────────────────
    # Structured logging makes grepping and shipping to log aggregators simpler.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    # Sets $connection_upgrade to "upgrade" for WebSocket requests,
    # "close" for everything else. Referenced in proxy snippet.
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        close;
    }

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # API zone: 30 requests/second per IP — generous for dashboard use
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Auth zone: 5 requests/second per IP — tighter to slow brute-force
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── Include server blocks ─────────────────────────────────────────────────
    # omni.conf is generated from the .template by envsubst on container start
    include /etc/nginx/conf.d/*.conf;
}
