# ssl.conf — TLS settings included in the HTTPS server block.
# Certificate paths (ssl_certificate / ssl_certificate_key) are NOT here —
# they use ${SSL_CERT} and ${SSL_KEY} substituted by envsubst in the template.
# This file only contains settings that do not require variable substitution.

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS — 6 months
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
