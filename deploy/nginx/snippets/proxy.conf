# proxy.conf — common proxy headers (include inside location blocks)

proxy_http_version  1.1;

# WebSocket upgrade support — $connection_upgrade and $http_upgrade are set
# by the map in nginx.conf.
proxy_set_header    Upgrade           $http_upgrade;
proxy_set_header    Connection        $connection_upgrade;

# Forward real client IP to backend so access logs and rate limiters see it
proxy_set_header    Host              $host;
proxy_set_header    X-Real-IP         $remote_addr;
proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto $scheme;

# Upstream timeouts — generous for long-poll / SSE endpoints
proxy_connect_timeout   10s;
proxy_send_timeout      60s;
proxy_read_timeout      60s;

# Buffer tuning — prevent slow clients from holding upstream connections open
proxy_buffering          on;
proxy_buffer_size        4k;
proxy_buffers            8 4k;
proxy_busy_buffers_size  8k;
