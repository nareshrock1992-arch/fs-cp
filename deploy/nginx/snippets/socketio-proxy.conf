# socketio-proxy.conf — proxy settings for WebSocket / Socket.IO location blocks.
# Use in place of proxy.conf — do NOT also include proxy.conf in the same location.
#
# Differs from proxy.conf:
#   proxy_read_timeout  3600s  (vs 60s — keeps WebSocket connections alive)
#   proxy_buffering     off    (required for WebSocket frame pass-through)
# Buffer tuning directives are omitted — they have no effect when buffering is off.

proxy_http_version  1.1;

proxy_set_header    Upgrade           $http_upgrade;
proxy_set_header    Connection        $connection_upgrade;

proxy_set_header    Host              $host;
proxy_set_header    X-Real-IP         $remote_addr;
proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto $scheme;

proxy_connect_timeout   10s;
proxy_send_timeout      60s;
proxy_read_timeout      3600s;

proxy_buffering         off;
