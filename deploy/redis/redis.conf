# redis.conf — production configuration for the Omni Platform
# Loaded by: redis-server /usr/local/etc/redis/redis.conf

# ── Authentication ────────────────────────────────────────────────────────────
# The password is injected via the REDIS_PASSWORD environment variable.
# docker-compose.yml overrides this file with:
#   command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}"
# so the password never appears in this file at rest.
requirepass REPLACE_WITH_ENV_OVERRIDE

# ── Network ───────────────────────────────────────────────────────────────────
# Bind only to the Docker bridge interface — the port is NOT exposed on the host.
bind 0.0.0.0
protected-mode yes

# ── Persistence (AOF) ─────────────────────────────────────────────────────────
# Append-only file gives durability without the blocking of RDB snapshots.
# Acceptable for session/queue data. If Redis data is fully ephemeral, set
# appendonly no and save "" to disable all persistence.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Disable RDB snapshots — AOF is enough; snapshots cause latency spikes.
save ""

# ── Memory ────────────────────────────────────────────────────────────────────
maxmemory 256mb
# allkeys-lru: evict least-recently-used keys when maxmemory is reached.
# Safe for caching workloads. Change to noeviction if Redis holds durable queues.
maxmemory-policy allkeys-lru

# ── Logical database separation ───────────────────────────────────────────────
# DB 0 → fs-cc (session tokens, socket state, queue snapshots)
# DB 1 → fs-enrs (campaign locks, rate limiting, advisory state)
# Only 2 databases needed — disable the rest to avoid confusion.
databases 2

# ── Security: disable dangerous commands ──────────────────────────────────────
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
rename-command EVAL     ""
rename-command SCRIPT   ""

# ── Performance ──────────────────────────────────────────────────────────────
tcp-backlog 511
timeout 0
tcp-keepalive 300
hz 10
aof-use-rdb-preamble yes

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile ""
